spring.application.name=curitiba360-api
server.port=8080

# Banco de Dados de Desenvolvimento (H2 em arquivo persistente local)
spring.datasource.url=jdbc:h2:file:./data/curitiba360db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Acesso visual ao banco em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
jwt.secret=c2VjdXJlX2N1cml0aWJhMzYwX2tleV9mb3Jfc2lnbmluZ19qd3RfdG9rZW5zXzIwMjY=
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000
